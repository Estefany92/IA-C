<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crashcat - Detector de Accidentes</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="app-bg text-white min-h-screen overflow-x-hidden">

    <div class="container mx-auto px-6 py-10">

        <!-- HEADER -->
        <div class="flex items-center justify-between mb-12">

            <div>
                <h1 class="text-5xl font-black title-glow">
                    CRASHCAT
                </h1>

                <p class="text-gray-300 mt-3 tracking-wide">
                    Sistema de detección de accidentes en tiempo real
                </p>
            </div>

        </div>

        <!-- DROP ZONE -->
        <div id="dropZone"
            class="drop-zone relative border-2 border-dashed rounded-3xl p-20 text-center cursor-pointer">

            <div class="space-y-4">

                <div class="text-7xl animate-bounce">
                    🚨
                </div>

                <h2 class="text-3xl font-bold">
                    Subir evidencia (imagen o video)
                </h2>

                <p class="text-gray-300">
                    Arrastra aquí o haz clic para analizar
                </p>

            </div>
        </div>

        <input type="file" id="fileInput" accept="image/*,video/*" class="hidden">

        <!-- LOADER -->
        <div id="loading" class="hidden flex justify-center items-center mt-10">
            <div class="loader"></div>
        </div>

        <!-- CANVAS -->
        <div class="mt-10">
            <canvas id="canvas" class="media-box w-full rounded-3xl"></canvas>
        </div>

        <!-- VIDEO -->
        <video id="videoPlayer" controls class="hidden mt-10 media-box w-full"></video>

        <!-- DOWNLOAD -->
        <div id="downloadContainer" class="mt-8"></div>

    </div>

    <script src="app.js"></script>
</body>

</html>
