<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crashcat - Detector</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="background"></div>

    <main class="app">

        <!-- HEADER -->
        <header class="header">
            <div>
                <h1>Crashcat</h1>
                <p>Detección inteligente de accidentes en tiempo real</p>
            </div>
        </header>

        <!-- CARD PRINCIPAL -->
        <section class="card">

            <!-- DROP ZONE -->
            <div id="dropZone" class="dropzone">
                <div class="icon">⬆️</div>
                <h2>Sube tu evidencia</h2>
                <p>Arrastra una imagen o video aquí o haz clic</p>
            </div>

            <input type="file" id="fileInput" accept="image/*,video/*" hidden>

            <!-- LOADER -->
            <div id="loading" class="loader-wrap hidden">
                <div class="loader"></div>
                <span>Analizando archivo...</span>
            </div>

            <!-- RESULTADOS -->
            <div class="media-container">
                <canvas id="canvas"></canvas>
                <video id="videoPlayer" controls class="hidden"></video>
            </div>

            <!-- DESCARGA -->
            <div id="downloadContainer"></div>

        </section>

    </main>

    <script src="app.js"></script>
</body>

</html>
